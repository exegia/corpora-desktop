# Daily (and on-demand) promotion: open a PR from `dev` into `next`.
#
# The version is what semantic-release will publish: conventional commits on
# `dev` since the last vX.Y.Z tag (`make next-version`). Nothing releasable,
# nothing promoted. The PR auto-merges once `guard` and `check` pass; pushing
# `next` then cuts `release/vX.Y.Z` (see next.yml).
#
# Schedule workflows are read from the default branch (`main`). This file
# does not fire on a cron until it has shipped there.
name: Promote to next

on:
  schedule:
    - cron: "0 22 * * *" # 22:00 UTC daily
  workflow_dispatch:

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

env:
  INSTALL_FLAGS: --frozen-lockfile

jobs:
  promote:
    name: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@v2
      - run: make install

      - name: Open or refresh the promote PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          git config user.name  "corpora-automation[bot]"
          git config user.email "corpora-automation[bot]@users.noreply.github.com"

          make bootstrap-lanes
          git fetch --quiet --force origin \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/heads/next:refs/remotes/origin/next \
            +refs/heads/main:refs/remotes/origin/main

          version="$(make -s --no-print-directory next-version REF=origin/dev)"
          if [ -z "$version" ]; then
            echo "### Promote skipped — no feat/fix/breaking commits on dev since the last tag" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Promote v$version" >> "$GITHUB_STEP_SUMMARY"

          make promote-pr VERSION="$version"
