# The release branch was cut or refreshed from `next`. Keep its draft PR
# into main up to date.
#
# Triggered by `push`, not `pull_request: [closed]`. GitHub matches
# `on.pull_request.branches` against a stack's *ultimate* base (main) rather
# than the PR's own parent, so a filter on `release/v*` would never match a
# stacked event. A push filter matches the ref that actually moved.
#
# Branch cleanup of feature heads is not this workflow's job: the repository's
# "Automatically delete head branches" setting removes a merged PR's branch,
# and `make cleanup-cycle` (after a production release) catches leftovers.
#
# Runs as the automation GitHub App rather than GITHUB_TOKEN: a PR opened with
# GITHUB_TOKEN cannot trigger further workflows, so the release PR's own checks
# would never start.
name: Release branch updated

on:
  push:
    branches:
      - "release/v*"

# Two cuts/refreshes at once must not both rewrite the release PR body.
concurrency:
  group: release-pr-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wrapup:
    name: wrapup
    # Deleting a release branch also delivers a push; there is nothing to
    # refresh then, and `make release-pr` would fetch a ref that is gone.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      # Full history: the release notes are a `git log main..release/vX.Y.Z`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Opens the PR when the branch is first cut and refreshes it on every
      # later push — `make release-pr` handles both.
      - name: Open or refresh the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: make release-pr
